<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Account</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container animate">

    <header class="header-content">
        <h1 class="page-title">CREATE ACCOUNT</h1>
        <p class="brand-name">PANDA</p>
    </header>

    <form class="signup-form" novalidate>

        <input class="form-input" id="fname" placeholder="First Name">
        <input class="form-input" id="lname" placeholder="Last Name">
        <input class="form-input" id="email" placeholder="Email">
        <input class="form-input" id="phone" placeholder="Phone">
        <input type="password" class="form-input" id="password" placeholder="Password">
        <input type="password" class="form-input" id="confirm" placeholder="Confirm Password">

        <button type="submit" class="submit-btn">
            Create Account
        </button>

    </form>
</div>

<script type="module" src="signup.js"></script>
</body>
</html>
