<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Panda Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container animate">

    <header class="header-content">
        <h1 class="page-title">WELCOME BACK!</h1>
        <p class="brand-name">PANDA</p>
    </header>

    <form class="login-form" novalidate>

        <input id="email" type="text" class="form-input" placeholder="Email">
        <input id="password" type="password" class="form-input" placeholder="Password">

        <button type="submit" class="login-btn submit-btn">
            Login
        </button>

        <div class="google-login">
            <button type="button" class="google-btn">
                <img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png">
                Sign in with Google
            </button>
        </div>

        <div class="signup-prompt">
            Don’t have an account?
            <a href="signup.html">Sign up</a>
        </div>

    </form>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
